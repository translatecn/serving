apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: stock-service-example
  namespace: default
spec:
  template:
    metadata:
      name: stock-service-example-v1
      annotations:
#        'autoscaling.knative.dev/initial-scale': 12
#        'serving.knative.dev/progress-deadline': 12s
    spec:
      containers:
        - image: registry.cn-hangzhou.aliyuncs.com/knative-sample/rest-api-go:v1
          env:
            - name: RESOURCE
              value: v1
          readinessProbe:
            httpGet:
              path: /
            initialDelaySeconds: 0
            periodSeconds: 3